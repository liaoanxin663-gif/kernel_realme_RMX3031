name: Build RMX3031 Kernel with KernelSU (MTK修复版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git libssl-dev libncurses5-dev python3 python-is-python3 zip wget

      - name: 下载 Clang 工具链
        run: |
          mkdir -p \~/clang
          wget -q "https://github.com/ZyCromerZ/Clang/releases/download/18.0.0git-20240101-release/Clang-18.0.0git-20240101.tar.gz" -O \~/clang.tar.gz
          tar -C \~/clang -zxf \~/clang.tar.gz

      - name: 下载 GCC 工具链
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \~/gcc64

      - name: 拉取内核源码
        run: |
          git clone --depth=1 https://github.com/liaoanxin663-gif/kernel_realme_RMX3031 -b T \~/kernel

      - name: 集成 KernelSU Next
        run: |
          cd \~/kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: 修复 MTK 头文件路径（针对你当前的错误）
        run: |
          cd \~/kernel
          
          # 修复 uxio_first_opt_trace.h include 方式
          find . -name "uxio_first_opt.c" -exec sed -i 's|<trace/uxio_first_opt_trace.h>|"trace/uxio_first_opt_trace.h"|g' {} +
          
          # 修复 mtk_ftrace.h 相关相对路径问题
          find kernel/trace -name "*.h" -o -name "*.c" | xargs sed -i 's|include "./mtk_ftrace.h"|include "mtk_ftrace.h"|g' 2>/dev/null || true
          find kernel/trace -name "*.h" -o -name "*.c" | xargs sed -i 's|include <./mtk_ftrace.h>|include "mtk_ftrace.h"|g' 2>/dev/null || true
          
          # 通用修复 define_trace.h 可能出现的相对路径问题
          find . -path "./include/trace/define_trace.h" -exec sed -i 's|include TRACE_INCLUDE(TRACE_INCLUDE_FILE)|include TRACE_INCLUDE(TRACE_INCLUDE_PATH/TRACE_INCLUDE_FILE)|g' {} + 2>/dev/null || true

      - name: 编译内核
        run: |
          cd \~/kernel
          export PATH=\~/clang/bin:\~/gcc64/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make CC=clang HOSTCC=gcc HOSTCXX=g++ LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- cupida_defconfig
          make CC=clang HOSTCC=gcc HOSTCXX=g++ LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- -j$(nproc) V=1 2>&1 | tee build.log

      - name: 打包 AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 \~/AnyKernel3
          cp \~/kernel/arch/arm64/boot/Image.gz \~/AnyKernel3/ || cp \~/kernel/arch/arm64/boot/Image \~/AnyKernel3/
          cd \~/AnyKernel3
          sed -i 's/device.name1=.*/device.name1=RMX3031/' anykernel.sh
          zip -r9 KernelSU_RMX3031.zip * -x .git

      - name: 上传编译结果
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_RMX3031
          path: \~/AnyKernel3/KernelSU_RMX3031.zip
          retention-days: 7
