name: Build RMX3031 KernelSU (分支663版)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 663

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git libssl-dev libncurses5-dev \
            python3 python-is-python3 zip wget

      - name: 编译内核
        run: |
          export PATH=$HOME/clang/bin:$HOME/gcc64/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out CC=clang HOSTCC=gcc HOSTCXX=g++ LLVM=1 LLVM_IAS=1 \
               CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- \
               cupida_defconfig
          make O=out CC=clang HOSTCC=gcc HOSTCXX=g++ LLVM=1 LLVM_IAS=1 \
               CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-android- \
               -j$(nproc) 2>&1 | tee build.log

      - name: 打包 AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cd AnyKernel3

          KERNEL_IMAGE=""
          for f in ../out/arch/arm64/boot/Image.gz ../out/arch/arm64/boot/Image; do
            if [ -f "$f" ]; then
              KERNEL_IMAGE="$f"
              break
            fi
          done

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "未找到 Image，列出实际生成的文件："
            find .. -name "Image*" | head -20
            exit 1
          fi

          cp "$KERNEL_IMAGE" ./
          sed -i 's/device.name1=.*/device.name1=RMX3031/' anykernel.sh
          zip -r9 KernelSU_RMX3031.zip * -x .git

      - name: 上传结果
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU_RMX3031
          path: AnyKernel3/KernelSU_RMX3031.zip
          retention-days: 7
